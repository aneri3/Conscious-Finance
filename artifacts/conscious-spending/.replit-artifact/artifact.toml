kind = "web"
previewPath = "/"
title = "Conscious Spending"
version = "1.0.0"
id = "artifacts/conscious-spending"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21964

[services.development]
run = "pnpm --filter @workspace/conscious-spending run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/conscious-spending", "run", "build" ]
publicDir = "artifacts/conscious-spending/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21964"
BASE_PATH = "/"
